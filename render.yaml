services:
  - type: web
    name: web-lab-waste-transport
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URI
        sync: false
      - key: SESSION_MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
